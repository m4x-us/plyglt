name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      # Task #507 (ESLint 9->10 upgrade, deferred): npm audit --audit-level=high alone would permanently red this gate —
      # postcss/sharp ship *inside* Next.js's own dependency tree even at its latest version
      # (unfixable from our side, see STATUS.md Known Issues), and the eslint/minimatch/
      # brace-expansion cluster needs a major ESLint 9->10 migration, deferred as its own task.
      # This step allows ONLY the exact documented baseline through — any NEW high-severity
      # advisory outside this list still fails the build. Keep this list in sync with
      # STATUS.md's Known Issues section; if one changes, update the other in the same commit.
      - name: Audit
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const acceptedBaseline = new Set([
              "next", "postcss", "sharp",
              "eslint", "eslint-config-next", "eslint-plugin-import",
              "eslint-plugin-jsx-a11y", "eslint-plugin-react",
              "@eslint/config-array", "@eslint/eslintrc",
              "minimatch", "brace-expansion"
            ]);
            const vulns = data.vulnerabilities || {};
            const unexpected = Object.keys(vulns).filter((name) => !acceptedBaseline.has(name));
            if (unexpected.length > 0) {
              console.error("FAIL: new high-severity vulnerabilities not in the documented baseline:", unexpected.join(", "));
              console.error("See STATUS.md Known Issues for the accepted baseline and why each entry is deferred.");
              process.exit(1);
            }
            console.log("OK: all high-severity findings are documented, accepted baseline entries — see STATUS.md.");
          '

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --coverage --reporter=verbose

      # Task #466: mechanical enforcement of AGENTS.md's Verification Gate banned-assertion
      # grep — root-cause fix for Task #455 (the gate had gone red with nothing checking it,
      # relying on a human/agent to run it by hand). Keep this command byte-for-byte
      # identical to AGENTS.md's Verification Gate section; if one changes, update the other
      # in the same commit so the two files cannot drift apart again.
      - name: Verification Gate — banned test assertions (AGENTS.md)
        run: |
          if grep -rn "\.toBeDefined()\|\.toBeTruthy()\|\.not\.toBeNull()\|\.toBeGreaterThan(0)" . --include="*.test.*" --exclude-dir=node_modules --exclude-dir=.claude --exclude-dir=.next | grep -v "existence-check:"; then
            echo "FAIL: banned assertion(s) found without an // existence-check: justification — see AGENTS.md's Verification Gate"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Validate all packs
        run: npm run pack:validate:all
