name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      # npm audit --audit-level=high alone would permanently red this gate — postcss/sharp
      # ship *inside* Next.js's own dependency tree even at its latest version (unfixable
      # from our side, see STATUS.md Known Issues). This step allows ONLY the exact
      # documented baseline through — any NEW high-severity advisory outside this list still
      # fails the build. Keep this list in sync with STATUS.md's Known Issues section; if one
      # changes, update the other in the same commit.
      #
      # 2026-08-04: shrunk from a wider eslint/minimatch/brace-expansion/eslint-config-next
      # cluster — those are no longer flagged (eslint's own dependency chain resolved
      # naturally over time; the one still-live brace-expansion finding was fixed with a
      # narrow package.json `overrides` pin instead of the ESLint 9->10 major upgrade that
      # was originally thought to be the only fix — see STATUS.md and Task #507).
      - name: Audit
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const acceptedBaseline = new Set([
              "next", "postcss", "sharp"
            ]);
            const vulns = data.vulnerabilities || {};
            // npm audit nests EVERY package touching a vulnerable chain into this object,
            // including moderate/low-severity ones pulled in only via a "via" reference to
            // a genuinely high-severity package (e.g. geist showed up here at severity
            // "moderate", via: ["next"] — it is not itself a high-severity finding). Only
            // entries whose OWN severity is high/critical are real --audit-level=high hits.
            const highOrCritical = Object.entries(vulns).filter(
              ([, v]) => v.severity === "high" || v.severity === "critical"
            );
            const unexpected = highOrCritical.filter(([name]) => !acceptedBaseline.has(name));
            if (unexpected.length > 0) {
              const names = unexpected.map(([name]) => name);
              console.error("FAIL: new high/critical-severity vulnerabilities not in the documented baseline:", names.join(", "));
              console.error("See STATUS.md Known Issues for the accepted baseline and why each entry is deferred.");
              for (const [name, v] of unexpected) {
                console.error(`--- full detail for "${name}" ---`);
                console.error(JSON.stringify(v, null, 2));
              }
              process.exit(1);
            }
            console.log("OK: all high-severity findings are documented, accepted baseline entries — see STATUS.md.");
          '

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --coverage --reporter=verbose

      # Task #494 audit (Batch 13 close-out): Task #153 built this E2E suite specifically so
      # a component-to-hook-to-store-to-renderer regression is caught in CI instead of staying
      # invisible until a user reports it — but nothing ever invoked it here, so that goal was
      # unmet for over a month. Chromium-only (this suite is a single smoke test proving the
      # real user path works at all, not a cross-browser compatibility suite — keep it that way
      # unless a real cross-browser bug motivates adding more).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        run: npm run test:e2e

      # Task #466: mechanical enforcement of AGENTS.md's Verification Gate banned-assertion
      # grep — root-cause fix for Task #455 (the gate had gone red with nothing checking it,
      # relying on a human/agent to run it by hand). Keep this command byte-for-byte
      # identical to AGENTS.md's Verification Gate section; if one changes, update the other
      # in the same commit so the two files cannot drift apart again.
      - name: Verification Gate — banned test assertions (AGENTS.md)
        run: |
          if grep -rn "\.toBeDefined()\|\.toBeTruthy()\|\.not\.toBeNull()\|\.toBeGreaterThan(0)" . --include="*.test.*" --exclude-dir=node_modules --exclude-dir=.claude --exclude-dir=.next | grep -v "existence-check:"; then
            echo "FAIL: banned assertion(s) found without an // existence-check: justification — see AGENTS.md's Verification Gate"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Validate all packs
        run: npm run pack:validate:all
