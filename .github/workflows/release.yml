name: Release

# Builds, signs, and publishes a plyglt release for macOS, Windows, and Linux
# whenever a version tag is pushed. Uses tauri-apps/tauri-action, which wraps
# `tauri build` plus per-platform signing and produces installers uploaded to
# one shared draft GitHub Release.
#
# macOS (Task #122/#123, live since 2026-07-29): Developer ID Application cert +
#   notarization via xcrun notarytool. Secrets: APPLE_CERTIFICATE,
#   APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
#   APPLE_TEAM_ID.
# Windows (Task #165, 2026-07-31): Azure Trusted/Artifact Signing via
#   artifact-signing-cli. Secrets: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   AZURE_TENANT_ID, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#   AZURE_SIGNING_PROFILE. See docs/SIGNING.md — this job fails at the signing
#   step until those 6 secrets exist (owner Azure Portal setup pending).
# Linux (Task #167, 2026-07-31): AppImage output, unsigned by design — AppImage
#   has no OS-level reputation gate the way Gatekeeper/SmartScreen do.
#
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Task #121,
# auto-updater manifest signing) are platform-agnostic and apply to all three.
#
# See docs/SIGNING.md for the full human setup walkthrough for each platform.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: ''
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Task #167 asks for AppImage specifically (no-install-required, works on all major
            # distros) — scoped to just that target rather than bundle.targets:"all"'s default of
            # deb+rpm+appimage, which would need `rpmbuild` installed on the runner for no benefit.
            bundles: '--bundles appimage'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci --frozen-lockfile

      - name: Build frontend (static export)
        run: npm run build

      - name: Import Apple code-signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/apple_certificate.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install Azure artifact-signing-cli
        if: matrix.platform == 'windows-latest'
        run: cargo install artifact-signing-cli

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'plyglt ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG or commit history for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.bundles }}

      # Task #166 real-device verification needs a downloadable Windows build, but the
      # signing step above fails until Task #165's Azure credentials are provisioned.
      # Verified directly in a real CI run's logs (2026-08-10): Tauri signs the raw
      # plyglt.exe BEFORE bundling it into the NSIS installer, not after — so when
      # signing fails, bundle/nsis/*.exe is never created at all (an earlier version of
      # this comment assumed the opposite). The raw compiled binary at
      # target/<target-triple>/release/plyglt.exe DOES already exist at that point and
      # is directly runnable (just without an installer/uninstaller/Start Menu entry).
      # `if: always()` uploads it as a workflow artifact (NOT a release asset — never
      # reaches end users) regardless of the signing outcome, purely so it can be
      # manually downloaded for VM testing. Remove once Task #165 is done and the
      # signed installer uploads to the release normally.
      - name: Upload unsigned Windows build (manual VM testing only, Task #166)
        if: always() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: plyglt-windows-unsigned-installer
          path: src-tauri/target/${{ matrix.target }}/release/plyglt.exe
          if-no-files-found: warn
