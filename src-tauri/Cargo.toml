[package]
name = "plyglt"
version = "0.1.0"
description = "plyglt — spaced repetition language learning"
authors = []
license = "MIT"
repository = ""
default-run = "plyglt"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "plyglt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Cargo "devtools" feature was temporarily added 2026-08-11 for live Task #166
# Windows VM diagnosis, then removed 2026-08-13 per Max's explicit decision: devtools
# must not ship in the real signed release. Without this feature, `tauri build`
# (.github/workflows/release.yml's build path — no `--debug` flag) never includes
# devtools; `tauri dev` / `tauri build --debug` still get devtools automatically via
# debug_assertions, independent of this feature, so local diagnosis is unaffected.
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-store        = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart    = "2"
tauri-plugin-updater      = "2"
# Task #519 — hands control back to the running app after a user completes OAuth
# sign-in in the system browser, via the custom `plyglt://` URL scheme registered
# in tauri.conf.json's plugins.deep-link.desktop.schemes.
tauri-plugin-deep-link    = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Explicit dependency (not just transitive) so lib.rs can call install_default() directly.
# "ring" matches the provider already resolved elsewhere in the tree (tauri-plugin-updater's
# own reqwest 0.13 dependency, tokio-rustls) — using a second provider (e.g. aws-lc-rs) would
# add a second crypto backend for no reason. Task #522 (real iOS Simulator run) found that with
# two reqwest major versions in the graph (this crate's own 0.12 pin, and 0.13 pulled in
# transitively by tauri-plugin-updater) and no default crypto provider installed anywhere, the
# app panics and crashes on first launch the moment any HTTP client is constructed — see
# lib.rs's install_default() call, the first thing run() does.
rustls     = { version = "0.23", features = ["ring"] }

# Task #166 — Windows OS-event listeners (src-tauri/src/os_events.rs windows_impl module):
# message-only window + WNDPROC for WM_POWERBROADCAST (wake) and WM_WTSSESSION_CHANGE (unlock),
# GetLastInputInfo (idle). windows-sys (not the older winapi crate) is Microsoft's current,
# actively-maintained low-level Win32 bindings crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
] }

# Task #167 — Linux OS-event listeners (src-tauri/src/os_events.rs linux_impl module):
# systemd-logind D-Bus signals for wake (PrepareForSleep) and unlock (Session.Unlock), plus
# IdleHint for idle detection. zbus is the actively-maintained pure-Rust D-Bus library;
# zbus_systemd provides pregenerated, versioned bindings for systemd's D-Bus interfaces rather
# than hand-rolled proxy definitions. Requires a small dedicated tokio runtime (zbus_systemd's
# generated proxies are async-only) confined to this one background thread — see linux_impl::start.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
zbus_systemd = { version = "0.26100", features = ["login1"] }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Task #522 — iOS APNs push-notification native glue (src-tauri/src/push.rs):
# adds token-registration callbacks to tao's runtime-declared AppDelegate class and wraps the
# UNUserNotificationCenter delegate to route push taps (tauri-plugin-notification's own iOS
# delegate deliberately ignores UNPushNotificationTrigger notifications). Versions pinned to
# the exact ones already resolved in Cargo.lock via tao/wry so no second objc2 major ever
# enters the graph (two objc2 versions would register colliding ObjC runtime classes).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
strip         = true
